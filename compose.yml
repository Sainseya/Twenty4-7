services:
  php:
    tty: true
    container_name: php
    build: .
    ports:
      - '9000:9000'
    volumes:
      - ./app:/var/www/symfony_docker
    networks:
      - app-network
    depends_on:
      - database

  webserver:
    tty: true
    image: nginx:latest
    container_name: webserver
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/symfony_docker
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
      - database
    networks:
      - app-network

  database:
    image: postgres:latest
    container_name: postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: twenty4-seven-db
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  postgresql_data:

networks:
  app-network:
    driver: bridge