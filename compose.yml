services:

  database:
    image: postgres:latest
    container_name: postgresql
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: twenty4-seven-db
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped

  php:
    container_name: php
    build: .
    ports:
    - "8000:8000"
    volumes:
      - ./:/var/www
    networks:
      - app-network
    depends_on:
      - database
    restart: unless-stopped

  webserver:
    image: httpd:latest
    container_name: webserver
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
    depends_on:
      - php
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgresql_data:

networks:
  app-network:
    driver: bridge